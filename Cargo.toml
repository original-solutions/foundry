[workspace]
resolver = "3"
members = [
    "crates/foundry-proto",
    "crates/foundry-holder",
    "crates/foundry-fake-agent",
    "crates/foundryd",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
foundry-proto = { path = "crates/foundry-proto" }
foundry-holder = { path = "crates/foundry-holder" }

axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.8", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures = "0.3.34"
nix = { version = "0.32.0", features = ["term", "process", "signal", "fs", "user", "time"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
ring = "0.17.14"
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "network"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "ansi"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

# A release build's cfg without its optimisation: CI runs the foundryd library tests in this
# profile to prove what a release build ignores (FOUNDRY_SECRETS, FOUNDRY_TAILSCALE,
# FOUNDRY_CLOCK_AHEAD). Those tests turn on debug_assertions alone, and the release profile's
# thin LTO and single codegen unit take minutes to compile.
[profile.release-cfg]
inherits = "dev"
debug-assertions = false
overflow-checks = false
debug = false

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
