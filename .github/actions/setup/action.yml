name: setup
description: >-
  Node, the web UI build that foundryd embeds, the Rust toolchain, the cargo cache and the crates:
  factory.provision in .dw/config.yml, which every Rust job in check.yml starts with.
inputs:
  save-cache:
    description: Whether this job saves the cargo cache. Matrix jobs share one cache; one saves it.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    # rustup on the runner installs the toolchain and components pinned in rust-toolchain.toml.
    - name: Rust toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ inputs.save-cache }}

    - name: npm --prefix web ci
      shell: bash
      run: npm --prefix web ci
    - name: npm --prefix web run build
      shell: bash
      run: npm --prefix web run build
    - name: cargo fetch --locked
      shell: bash
      run: cargo fetch --locked
