# Runs the provision and gate commands on Linux. The factory gates on macOS. The steps mirror
# factory.provision and factory.gate in .dw/config.yml: change both together.
#
# Three steps are CI only and not in factory.gate: the e2e step and the two release steps.
#
# `npm --prefix web run e2e` runs the browser test, web/e2e/ui.spec.ts: the real terminal against
# a real daemon, with the fake agent as `claude`. It needs Google Chrome, which ubuntu-latest
# ships. Its setup builds and starts the debug foundryd, foundry-holder and foundry-fake-agent; it
# runs after the `cargo test` step, which leaves them in target/debug, so that build has nothing
# left to do. The factory gates on macOS, and the test starts a real daemon and a browser, so it
# runs here only.
#
# `cargo test --release -p foundryd --lib --locked` runs the tests that prove a release build
# ignores the test-only overrides FOUNDRY_SECRETS and FOUNDRY_TAILSCALE, which a debug build cannot
# run; the step before it builds the holder and the fake agent those library tests start. The
# factory gates on macOS, where a release build ignores FOUNDRY_SECRETS, so a release test that
# reaches the secret store would use the real login keychain.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main has a group of its own, so
# every commit on main is checked to the end.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # rustup on the runner installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: npm --prefix web ci
        run: npm --prefix web ci
      - name: npm --prefix web run build
        run: npm --prefix web run build
      - name: cargo fetch --locked
        run: cargo fetch --locked

      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
      - name: npm --prefix web run e2e
        run: npm --prefix web run e2e
      - name: cargo build --release -p foundry-holder -p foundry-fake-agent --locked
        run: cargo build --release -p foundry-holder -p foundry-fake-agent --locked
      - name: cargo test --release -p foundryd --lib --locked
        run: cargo test --release -p foundryd --lib --locked
      - name: npm --prefix web run check
        run: npm --prefix web run check
