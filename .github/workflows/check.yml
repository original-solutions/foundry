# Runs the provision and gate commands from .dw/config.yml on Linux. The factory gates on macOS.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # rustup on the runner installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: npm --prefix web ci
        run: npm --prefix web ci
      - name: npm --prefix web run build
        run: npm --prefix web run build
      - name: cargo fetch --locked
        run: cargo fetch --locked

      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
      - name: npm --prefix web run check
        run: npm --prefix web run check
