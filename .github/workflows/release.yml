# Publishes a release when a vX.Y.Z tag is pushed: foundryd-<arch>-<os>.tar.gz for four targets,
# each holding foundryd and foundry-holder at its top level, and beside each one an Ed25519
# signature (.sig) that the updater checks before it unpacks anything (crates/foundryd/src/update.rs).
#
# Only the publish job sees RELEASE_SIGNING_KEY. It publishes nothing unless the public key of that
# secret equals RELEASE_KEY in update.rs and every signature verifies against RELEASE_KEY.
#
# Release builds use no cache, so nothing a pull request's run left behind reaches a release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stops the run before any build when the tag is not v followed by foundryd's version, and
  # builds the web UI once for every binary to embed.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install

      - name: The tag is v followed by foundryd's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "foundryd") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG is not v$version, the version of foundryd in Cargo.toml"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm --prefix web ci
        run: npm --prefix web ci
      - name: npm --prefix web run build
        run: npm --prefix web run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # Both macOS targets on one runner: macOS minutes cost ten times as much.
  macos:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build and pack
        env:
          COPYFILE_DISABLE: '1'
        run: |
          mkdir dist
          for pair in aarch64-apple-darwin:aarch64-macos x86_64-apple-darwin:x86_64-macos; do
            target=${pair%%:*}
            name=${pair#*:}
            cargo build --release --locked -p foundryd -p foundry-holder --target "$target"
            tar -czf "dist/foundryd-$name.tar.gz" -C "target/$target/release" foundryd foundry-holder
          done

      - uses: actions/upload-artifact@v4
        with:
          name: foundryd-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  # aarch64-linux is cross-compiled here with the aarch64-linux-gnu toolchain.
  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: x86_64-linux
          - target: aarch64-unknown-linux-gnu
            name: aarch64-linux
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: aarch64-linux-gnu toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Build and pack
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          cargo build --release --locked -p foundryd -p foundry-holder --target "$TARGET"
          mkdir dist
          tar -czf "dist/foundryd-$NAME.tar.gz" -C "target/$TARGET/release" foundryd foundry-holder

      - uses: actions/upload-artifact@v4
        with:
          name: foundryd-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The only job that sees the signing key.
  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: foundryd-*
          path: dist
          merge-multiple: true

      # RELEASE_KEY as hex, and as a PEM public key for openssl (the 12-byte DER prefix of an
      # Ed25519 public key, then the raw key).
      - name: Read RELEASE_KEY from update.rs
        id: key
        run: |
          hex=$(sed -n 's/^const RELEASE_KEY_HEX: &str = "\([0-9a-f]\{64\}\)";$/\1/p' crates/foundryd/src/update.rs)
          if [ "$(printf '%s\n' "$hex" | grep -c .)" != 1 ]; then
            echo "::error::crates/foundryd/src/update.rs has no single RELEASE_KEY_HEX line"
            exit 1
          fi
          python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.argv[1]))' \
            "302a300506032b6570032100$hex" > "$RUNNER_TEMP/release-key.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/release-key.der" -out "$RUNNER_TEMP/release-key.pem"
          echo "hex=$hex" >> "$GITHUB_OUTPUT"

      # The key goes only into a mode 600 temporary file, removed when this step ends however it
      # ends, and nothing prints it.
      - name: Sign every archive
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          EXPECTED: ${{ steps.key.outputs.hex }}
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/signing.XXXXXX")
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          derived=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -v -tx1 | tr -d ' \n')
          if [ "$derived" != "$EXPECTED" ]; then
            echo "::error::the public key of RELEASE_SIGNING_KEY is not RELEASE_KEY in crates/foundryd/src/update.rs"
            exit 1
          fi
          for archive in dist/*.tar.gz; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$archive" -out "$archive.sig"
          done
          rm -f "$key"

      - name: Check every archive and signature
        run: |
          expected=8
          found=$(find dist -type f | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::dist holds $found files, not four archives and four signatures"
            exit 1
          fi
          for name in aarch64-macos x86_64-macos aarch64-linux x86_64-linux; do
            archive="dist/foundryd-$name.tar.gz"
            if [ ! -f "$archive" ] || [ ! -f "$archive.sig" ] || [ "$(wc -c < "$archive.sig")" -ne 64 ]; then
              echo "::error::$archive or its 64-byte signature is missing"
              exit 1
            fi
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-key.pem" -rawin \
              -in "$archive" -sigfile "$archive.sig"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
