# foundry: a Rust workspace (toolchain pinned in rust-toolchain.toml) that embeds a web UI built with npm.
# The cloud image has Node but no Rust, and ~/.cargo/bin is not on the PATH a session's shell gets, so
# rustup is installed from its checksum-verified binary and linked into /usr/local/bin.

[install]                     # baked into the environment snapshot
run = [
  "T=$(uname -m)-unknown-linux-gnu && cd /tmp && curl --proto '=https' --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/dist/$T/rustup-init && echo \"$(curl --proto '=https' --tlsv1.2 -sSf https://static.rust-lang.org/rustup/dist/$T/rustup-init.sha256 | awk '{print $1}')  rustup-init\" | sha256sum -c - && chmod +x rustup-init && ./rustup-init -y --profile minimal --default-toolchain none --no-modify-path && rm rustup-init",
  "sudo ln -sf $HOME/.cargo/bin/* /usr/local/bin/",
  "rustup toolchain install",   # reads rust-toolchain.toml
  "npm --prefix web ci --no-audit --no-fund",
  "npm --prefix web run build",
  "cargo fetch --locked",
]

[setup]                       # every boot/resume: re-sync deps in case the branch changed a lockfile
run = [
  "rustup toolchain install",
  "npm --prefix web ci --prefer-offline --no-audit --no-fund",
  "cargo fetch --locked",
]
